repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.18.2
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-yaml
  - id: check-toml
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.9
  hooks:
  # Lint
  - id: ruff
    args: [--fix]
  # Format (replaces black)
  - id: ruff-format
